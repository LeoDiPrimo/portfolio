<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d1018" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Leo Di Primo · Backend Software Engineer · Java / Spring Boot</title>
    <meta
      name="description"
      content="Software Engineer con más de 7 años de experiencia resolviendo problemas complejos a través del software."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Leo Di Primo · Backend Software Engineer" />
    <meta
      property="og:description"
      content="Software Engineer con más de 7 años de experiencia resolviendo problemas complejos a través del software."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Applies the stored theme before first paint. Without this the page would
      flash the default theme on load. Kept inline and synchronous on purpose.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          document.documentElement.setAttribute(
            'data-theme',
            stored === 'light' || stored === 'dark' ? stored : 'dark',
          )
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
